<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ray Tracer Wasm</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #d6e4ff 0%, #d4d8e3 40%, #b8bdcb 100%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
      }

      .shell {
        width: min(92vw, 980px);
        padding: 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 14px 40px rgba(14, 22, 46, 0.2);
        backdrop-filter: blur(3px);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
        image-rendering: pixelated;
      }

      .meta {
        margin-top: 8px;
        font-size: 12px;
        color: #19223d;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <canvas id="screen"></canvas>
      <div class="meta" id="meta">starting...</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
